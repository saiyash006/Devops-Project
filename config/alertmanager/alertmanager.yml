global:
  resolve_timeout: 1m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'webhook-logger'

receivers:
- name: 'webhook-logger'
  webhook_configs:
  # Using a dummy endpoint, or e.g., the ehr-mock just to have a target, but here we can just use a blackhole or local endpoint
  - url: 'http://api-service:8000/health'
    send_resolved: true
