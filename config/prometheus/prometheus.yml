global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-service"
    static_configs:
      - targets: ["api-service:8000"]

  - job_name: "ai-agent-service"
    static_configs:
      - targets: ["ai-agent-service:8000"]

  - job_name: "worker"
    static_configs:
      - targets: ["worker:8000"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
